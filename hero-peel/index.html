<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#050506;overflow:hidden;touch-action:none}
  body{cursor:grab;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
       font-family:'Syne','Inter',Helvetica,Arial,sans-serif}
  body.hold{cursor:grabbing}
  .hero{position:fixed;inset:0;overflow:hidden;perspective:1400px;
      background:radial-gradient(60% 50% at 50% 50%,#111116 0%,#040405 75%)}
  .world{position:absolute;inset:0;transform-style:preserve-3d;
      transition:transform .5s cubic-bezier(.2,.8,.2,1)}
  /* The shadow is kept tight on purpose. A 60px blur under thirty pictures is
     re-blurred every frame as they move in depth, and it was the single largest
     cost in the drift; at 26px it still separates overlapping pictures. */
  .ph{position:absolute;left:50%;top:50%;transform-style:preserve-3d;
      opacity:0;transition:opacity 1.4s ease;
      box-shadow:0 10px 26px rgba(0,0,0,.72)}
  .ph.in{opacity:1}
  /* Depth is cued by veiling the far pictures rather than by a brightness filter.
     Opacity rides on the compositor; a filter forces a repaint of every element
     that crosses the threshold. */
  .ph img{display:block;width:100%;height:auto;opacity:.93;transition:opacity .7s ease}
  .ph.near img{opacity:1}
  .ring{position:absolute;left:50%;top:50%;z-index:850;pointer-events:none;
      width:min(74vmin,760px);aspect-ratio:1;transform:translate(-50%,-50%);
      border:1px solid rgba(255,255,255,.10);border-radius:50%;
      opacity:0;animation:ringIn 2.4s 1s ease forwards}
  @keyframes ringIn{to{opacity:1}}
  .scrim{position:absolute;inset:0;z-index:880;pointer-events:none;
      background:radial-gradient(ellipse 40% 26% at 50% 50%,rgba(0,0,0,.6),rgba(0,0,0,0) 70%)}
  .title{position:absolute;inset:0;z-index:900;display:grid;place-items:center;pointer-events:none;padding:8vw}
  .title h1 span{white-space:pre}
  .title h1{font-weight:800;color:#fff;text-align:center;
      line-height:.95;font-size:clamp(2.2rem,7vw,7rem);letter-spacing:-.02em;
      text-shadow:0 0 90px rgba(0,0,0,.8);
      transform:scale(.86);opacity:0;animation:pop 1.7s .3s cubic-bezier(.16,.9,.2,1) forwards}
  @keyframes pop{to{transform:scale(1);opacity:1}}
  .hint{position:absolute;left:0;right:0;bottom:clamp(18px,4.4vh,42px);z-index:960;text-align:center;
      font-weight:600;font-size:10px;letter-spacing:.32em;text-transform:uppercase;
      color:rgba(255,255,255,.42);pointer-events:none;opacity:0;
      animation:hintIn 1s 3s forwards,hintOut 1.4s 14s forwards}
  @keyframes hintIn{to{opacity:1}} @keyframes hintOut{to{opacity:0}}

  body,.title h1,button{font-family:'Roboto Mono','SFMono-Regular',Menlo,monospace}
  .title h1{font-weight:700;letter-spacing:-.045em;line-height:1.0}
  .hint{font-weight:400;letter-spacing:.24em;font-size:9.5px}
  .ring{animation:none;opacity:0}

  /* THE SKY — an opaque ramp from night to a pale horizon, plus a falloff that
     darkens one end of the horizon so the light is never symmetrical. */
  .dawn{position:fixed;left:100%;top:100%;z-index:984;transform-origin:0 0;will-change:transform;
      pointer-events:none;opacity:0}
  /* THE SUN — laid over the sky with alpha only. Normal compositing keeps the orange
     truly orange (screen blending can't remove the sky's blue, so it goes pink). */
  .glow{position:fixed;left:0;top:0;z-index:985;transform-origin:0 0;will-change:transform;
      pointer-events:none;opacity:0}
  /* a whisper of noise so the sky dithers instead of banding */
  .grain{position:fixed;inset:0;z-index:987;pointer-events:none;mix-blend-mode:overlay;opacity:0;
      transition:opacity .9s ease;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
      background-size:140px 140px}

  /* The cream underside. It is a huge rectangle rotated onto the fold rather than a
     full-screen box with an animated clip-path — moving it is then pure compositing,
     with no repaint at all. Its text lives in an upright layer above it. */
  .paper{position:fixed;left:100%;top:100%;z-index:990;transform-origin:0 0;will-change:transform;
      background:linear-gradient(180deg,#e9e4da 0px,#fbf8f2 760px,#f5f1e9 1800px)}
  /* The hero's body is user-select:none; a sub-page's is not, because a bio should be
     copyable. The nav is not text to copy, though, and dragging the peel open runs
     straight through it - so the list opts out here, where both pages share it. */
  .under{position:fixed;inset:0;z-index:991;pointer-events:none;
      -webkit-user-select:none;user-select:none}
  .under.live ol{pointer-events:auto}
  .under ol{pointer-events:none;list-style:none;position:absolute;right:clamp(26px,4.4vw,64px);bottom:clamp(26px,4.6vh,60px);
      text-align:right;display:grid;gap:clamp(6px,1.4vh,14px)}
  .under li{font-family:'Roboto Mono',monospace;font-weight:500;text-transform:uppercase;
      letter-spacing:.02em;line-height:1;color:#12120f;cursor:pointer;
      font-size:clamp(1rem,2.9vw,2.35rem)}
  .under li span{display:inline-block;transition:transform .28s cubic-bezier(.2,.8,.2,1),color .2s ease}
  .under li:hover span{transform:translateX(-14px);color:#e4581a}
  .under .credit{position:absolute;right:clamp(26px,4.4vw,64px);top:clamp(26px,4.6vh,60px);
      font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(20,20,16,.42);
      text-align:right;line-height:2}
  .fold{position:fixed;z-index:995;left:100%;top:100%;height:1px;will-change:transform;
      transform-origin:0 0;pointer-events:none;opacity:0}

  /* the sun's limb: a hot line on the horizon exactly over the sun's centre, plus a
     softer bloom under it. Both ride the fold and taper to nothing at each end. */
  /* The sun's limb. Both lines are a fixed size and are moved only by transform —
     animating left/width would force a layout (and a re-blur) on every frame, which is
     what makes a compositor shed half-drawn tiles. The soft one gets its falloff from a
     gradient and a mask instead of a filter, so nothing has to be re-blurred at all. */
  .limbGlow{position:fixed;left:0;top:0;z-index:988;height:26px;will-change:transform;
      transform-origin:0 0;pointer-events:none;opacity:0;

  .limb{position:fixed;left:0;top:0;z-index:989;height:3px;will-change:transform;
      transform-origin:0 0;pointer-events:none;opacity:0;filter:blur(1px)}

  /* The mark that asks for the lift. It used to be a white triangle filling the corner;
     it is an info mark now, set in from the two edges. The drawing comes from the SVGs in
     hero-peel/ - white here, black on a cream sub-page - so the shape is edited in
     Illustrator, not in CSS. The patch that opens the peel is still the whole corner
     band, so the mark is a sign rather than the only target. */
  .dog{position:fixed;right:clamp(20px,2.4vw,34px);bottom:clamp(18px,2.4vh,30px);z-index:940;
      cursor:pointer;width:clamp(26px,2.6vw,36px);line-height:0}

  /* ---- a picture you can open ---- */
  .ph{cursor:pointer}
  .ph img{transition:filter .4s ease,opacity .7s ease}
  .ph.hot img{filter:brightness(.62) saturate(.92) contrast(1.03)}
  .ph.hot img{opacity:1}
  .ph.hot{box-shadow:0 0 0 1px rgba(255,255,255,.6),
      0 0 34px 4px rgba(255,178,84,.34),0 34px 90px rgba(0,0,0,.75)}
  /* hidden rather than transparent: a transparent overlay on all 30 pictures still
     gets painted every frame, and it shows up in the frame budget */
  /* the dark overlay covers the whole photo on hover; the caption sits at the bottom */
  .cap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
      padding:.62em;opacity:0;visibility:hidden;pointer-events:none;
      transition:opacity .32s ease,visibility 0s linear .32s;background:rgba(6,6,10,.66)}
  .ph.hot .cap{opacity:1;visibility:visible;transition:opacity .32s ease,visibility 0s}
  .cap .kick{font-size:.34em;letter-spacing:.22em;text-transform:uppercase;font-weight:500;
      color:rgba(255,255,255,.72);margin-bottom:.5em}
  .cap .q{font-size:.82em;line-height:1.16;font-weight:500;color:#fff;letter-spacing:-.01em;
      text-shadow:0 2px 14px rgba(0,0,0,.7)}

  /* ---- the story it opens into ---- */
  .ovl{position:fixed;inset:0;z-index:1200;display:grid;place-items:center;padding:clamp(14px,3vh,44px);
      background:rgba(4,5,9,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
      opacity:0;pointer-events:none;transition:opacity .4s ease}

  .card{width:min(920px,100%);max-height:100%;background:#f3efe7;color:#14140f;
      display:flex;flex-direction:column;overflow:hidden;position:relative;
      box-shadow:0 50px 140px rgba(0,0,0,.6)}
  .cardScroll{overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain}
  .card .shot{display:block;width:100%;height:clamp(190px,32vh,340px);object-fit:cover;background:#ddd8cd}

  .card .kick{display:block;font-size:10px;letter-spacing:.32em;text-transform:uppercase;
      color:#9a8f7c;margin-bottom:1.1em}
  .card h2{font-size:clamp(1.35rem,3.3vw,2.3rem);line-height:1.14;letter-spacing:-.035em;
      font-weight:500;margin-bottom:.9em;max-width:22ch}

  .card .body a{color:#14140f;text-decoration:underline;text-decoration-color:#b5ac9b;

  /* Supporting images are the work, not a contact sheet: each runs the full width of
     the column at its own proportions, with nothing cropped away, and carries a caption
     under it. Height comes from the width and the img's own width/height attributes, so
     the card does not jump as each one loads. */

  /* brand mark, bottom left — the peel now stops short of it */
  .logo{position:fixed;left:clamp(18px,3vw,40px);bottom:clamp(16px,3vh,34px);z-index:1000;

<script>
const IMAGES = [{"id": 0, "w": 1024, "h": 510, "src": "assets/paperboy/main.jpg"}, {"id": 1, "w": 983, "h": 1280, "src": "assets/sunny%20ears/main.jpg"}, {"id": 2, "w": 1280, "h": 853, "src": "assets/pixar%20lab.ble/main.jpg"}, {"id": 3, "w": 1280, "h": 853, "src": "assets/illuminate/main.jpg"}, {"id": 4, "w": 1280, "h": 720, "src": "assets/fate%20matchbooks/main.jpg"}, {"id": 5, "w": 1200, "h": 1133, "src": "assets/lagu%20hantu/main.jpg"}, {"id": 6, "w": 1280, "h": 854, "src": "assets/awty/main.jpg"}, {"id": 7, "w": 1280, "h": 853, "src": "assets/desa-kala-patra/main.jpg"}, {"id": 8, "w": 960, "h": 1280, "src": "assets/light%20play/main.jpg"}, {"id": 9, "w": 1280, "h": 854, "src": "assets/understanding%20understanding/main.jpg"}, {"id": 10, "w": 1280, "h": 853, "src": "assets/when%20is%20now%3F/main.jpg"}, {"id": 11, "w": 720, "h": 1280, "src": "assets/PS%20I%20love%20you/main.jpg"}];
const PAGES = ["Stories","Dabblers","Our Team","About","Contact"];

/* ---- headline kerning -------------------------------------------------------------
   Roboto Mono is monospaced: every glyph gets the same advance width, so the apostrophe
   sits alone in a cell as wide as a W while w and h nearly fill theirs. There are no kern
   pairs in the font, and letter-spacing moves every pair at once, so the only way to fix
   one pair without disturbing the rest is to nudge it by hand.

   Each key is a character PAIR; the value shifts the second character, in em. Negative
   pulls the pair together, positive opens it. Case matters - "Wh" and "wh" are separate.
   Edit the numbers here; nothing else needs to change.                                  */
const KERN = {
  "t\u2019":  -0.16,   // What's  - close the gap before the apostrophe
  "\u2019s":  -0.16,   // What's  - and after it
  "Wh":   0.055,   // What's  - give the capital W room against the h
  "wh":   0.055,   // what if - same, lowercase
  "ha":   0.020    // both words
};

(function kernHeadline(){
  const h = document.getElementById('title');
  if(!h) return;
  [...h.childNodes].forEach(n=>{
    if(n.nodeType !== 3) return;                    // leave the <br> alone
    const t = n.nodeValue, frag = document.createDocumentFragment();
    for(let i=0; i<t.length; i++){
      const sp = document.createElement('span');
      sp.textContent = t[i];
      const k = KERN[(i ? t[i-1] : '') + t[i]];
      if(k) sp.style.marginLeft = k + 'em';
      frag.appendChild(sp);
    }
    h.replaceChild(frag, n);
  });
})();
const hero=document.getElementById('hero'), world=document.getElementById('world');
const rand=(a,b)=>a+Math.random()*(b-a);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const narrow=innerWidth<720;
const GOLD=Math.PI*(3-Math.sqrt(5));

const nodes=[];
const N = narrow?18:30;
const bag=shuffle(IMAGES);
const minSide=Math.min(innerWidth,innerHeight);

for(let i=0;i<N;i++){
  const d=bag[i%bag.length];
  const el=document.createElement('div'); el.className='ph';
  const long=(narrow?rand(30,46):rand(15,26));
  el.style.width=(d.w>=d.h? long : long*(d.w/d.h))+'vw';
  el.innerHTML='<img src="'+d.src+'" alt="" draggable="false">';
  world.appendChild(el);
  nodes.push({el,i,img:d, a:i*GOLD, rad:Math.sqrt((i+1)/N)*minSide*(narrow?.78:1.02),
              z:rand(-460,240), spin:rand(-9,9), push:0, lift:0});
  setTimeout(()=>el.classList.add('in'), 340*i);
}

/* Shared bloom state — nav layers read and nudge these. */
const HERO={nodes,minSide,narrow,PAGES,dt:1,rot:0,dive:0,held:false,slow:0,dir:1,rotOffset:0,diveOnHold:true,wheelLocked:false,
            extraDive:0,frame:[],x:0,y:0,freeze:false};

let rot=0, speed=0.0016, tiltX=0, tiltY=0, curX=0, curY=0, dive=0, held=false;

addEventListener('pointermove',e=>{
  HERO.x=e.clientX; HERO.y=e.clientY;
  tiltY=(e.clientX/innerWidth-.5)*22;
  tiltX=-(e.clientY/innerHeight-.5)*18;
},{passive:true});
addEventListener('pointerdown',()=>{held=true;document.body.classList.add('hold')});
addEventListener('pointerup',()=>{held=false;document.body.classList.remove('hold')});
addEventListener('wheel',e=>{ if(HERO.wheelLocked) return;   // something else is scrolling
  e.preventDefault(); speed += e.deltaY*0.000012},{passive:false});

/* Everything below is measured in real time, not in frames. A frame that arrives
   late then advances the wheel further, so a hitch reads as a moment of motion
   rather than a stall-and-jump, and the drift runs at the same speed on a 60Hz
   panel as on a 120Hz one. Long gaps are clamped so a backgrounded tab does not
   teleport the scene on return. */
let last=performance.now();
HERO.ease=k=>1-Math.pow(1-k,HERO.dt);

function frame(now){
  const t=now||performance.now();
  HERO.dt=Math.min(Math.max(t-last,4),50)/16.667; last=t;
  const E=HERO.ease;
  dive += ((((held&&HERO.diveOnHold)?1:0)+HERO.extraDive) - dive)*E(0.07);
  dive = Math.min(dive, 1.6);
  const target=((held&&HERO.diveOnHold)?0.0072:0.0016)*(1-HERO.slow);
  speed += (target-speed)*E(0.03);
  /* HERO.freeze stops the wheel dead rather than easing it down. A nav layer sets it
     while the bloom is hidden, so the field is exactly where it was left when it
     returns - HERO.slow only decays the speed, which still creeps. */
  if(!HERO.freeze) rot += speed*HERO.dir*HERO.dt;
  curX += (tiltX-curX)*E(0.06); curY += (tiltY-curY)*E(0.06);
  HERO.rot=rot; HERO.dive=dive; HERO.held=held; HERO.tiltX=curX; HERO.tiltY=curY;
  world.style.transform=`rotateX(${curX}deg) rotateY(${curY}deg) translateZ(${dive*180}px)`;
  nodes.forEach((n,i)=>{
    const a=n.a+rot+HERO.rotOffset;
    const r=n.rad*(1-dive*0.28)*(1+n.push);
    const x=Math.cos(a)*r*(narrow?1:1.28), y=Math.sin(a)*r*(narrow?.9:.74);
    const z=n.z + dive*260 + n.lift + Math.sin(rot*2+i)*26;
    n.nx=x; n.ny=y;                        // natural position, before any nudge
    const ox=n.ox||0, oy=n.oy||0;          // a per-picture nudge, used when one is picked up
    n.el.style.transform=`translate(-50%,-50%) translate3d(${x+ox}px,${y+oy}px,${z}px) rotate(${Math.sin(a)*n.spin}deg)`;
    /* A gap between the on and off points, so a picture hovering at the threshold
       does not sit there flickering between the two states. */
    const nr = n.near ? z>48 : z>72;
    if(nr!==n.near){ n.near=nr; n.el.classList.toggle('near', nr) }
    n.sx=innerWidth/2+x+ox; n.sy=innerHeight/2+y+oy; n.sz=z;
  });
  HERO.frame.forEach(f=>f());
  requestAnimationFrame(frame);
}
frame();

const STORIES={"0": {"k": "Paperboy · 2026", "q": "What if local news was a locals-only club?", "above": "In the face of changing media landscapes and local news organizations shuttering around the country, what everyday needs are left unfulfilled? \n\nPaperboy began as a research question about the role of local news and media in the lives of residents in Monterey County, California. What emerged was a rich picture of old and new mediums meeting ancient and modern problems: How can I be relevant without being perceived? How can I find solace in my neighbors in hard times? How can sending an article mean \"I'm thinking of you\"?", "below": "Through our research, we found that the problem was not what we expected: rather than another news institution competing for attention and headlines, what was truly needed was a way to repair people's social fabric with their neighbors. By shifting our eye to the \"noun condition\", Paperboy is now something for people to be part of, offering a fresh take on what a news organization should be.", "caption": "Title Image Reference · Satire Image by Frederick Burr Opper, 1894", "support": [{"src": "assets/paperboy/SCR-20260903-ohvc.jpg", "w": 1600, "h": 903, "caption": "Prototype interactive map of Monterey County (Produced for Paperboy by Dabble. 2026)"}], "carousel": [], "story": false, "dabbler": true, "credits": ["Yousef Al-Riyami", "Kel Huang", "Maggie Namaganda", "Eric Singleton"], "slug": "paperboy"}, "1": {"k": "Sunny Ears · 2026", "q": "What if we could protect our brains by taking care of our ears?", "above": "The world around us has not been built keeping our ears in mind, and it turns out, most users don't give them much thought either. \n\nThere is mounting evidence that hearing health is one of the most easily modifiable risk factors for preventing neurodegenerative disease later in life. Hearing aids help, but how do we get people to wear them?", "below": "Hearing aid technologies face cultural and systemic barriers to adoption, with only a 62% adherence rate among patients who choose intervention.  This project explores the technologies, behaviors and systems that surround hearing loss, and determined that we can do better. [Citation: https://pmc.ncbi.nlm.nih.gov/articles/PMC10299666/]", "caption": "", "support": [{"src": "assets/sunny%20ears/priyanka-singh-Jt72_opb38I-unsplash.jpg", "w": 1600, "h": 1233, "caption": ""}], "carousel": [], "story": false, "dabbler": true, "credits": ["Anastasha Rachel Gunawan", "Julia Hou", "Sanzhar Myrzagalym", "Shawn Smith", "Yousef Al-Riyami"], "slug": "sunny ears"}, "2": {"k": "Pixar Lab.ble · 2026", "q": "What if creative studios collaborated as soulmates, not as business partners?", "above": "We hope to share more of this project soon... :)", "below": "", "caption": "", "support": [], "carousel": [], "story": false, "dabbler": true, "credits": ["Anastasha Rachel Gunawan"], "slug": "pixar lab.ble"}, "3": {"k": "Illuminate Pain · 2026", "q": "What if pain wasn't just a number from 1-10?", "above": "Pain is full of nuance and meaning. The 1-10 pain scale ignores it all, reducing a complex experience to a singular point. Particularly in chronic pain contexts, there is a gap between what an individual is able to express and what providers of care are able to understand.", "below": "Illuminate explores what it looks like to give pain a new visual language, one that empowers patient advocacy while providing clinical utility.", "caption": "", "support": [{"src": "assets/illuminate/WhatsApp%20Image%202026-09-09%20at%2000.44.09%20%281%29.jpg", "w": 1600, "h": 1067, "caption": ""}, {"src": "assets/illuminate/WhatsApp%20Image%202026-09-09%20at%2000.44.09.jpg", "w": 1600, "h": 943, "caption": ""}, {"src": "assets/illuminate/WhatsApp%20Image%202026-09-09%20at%2000.44.11.jpg", "w": 1600, "h": 1067, "caption": ""}], "carousel": [{"src": "assets/illuminate/carousel/WhatsApp%20Image%202026-09-09%20at%2000.44.10%20%281%29.jpg", "w": 1600, "h": 1066, "caption": ""}, {"src": "assets/illuminate/carousel/WhatsApp%20Image%202026-09-09%20at%2000.44.10%20%282%29.jpg", "w": 1600, "h": 1067, "caption": ""}, {"src": "assets/illuminate/carousel/WhatsApp%20Image%202026-09-09%20at%2000.44.10.jpg", "w": 1600, "h": 1066, "caption": ""}, {"src": "assets/illuminate/carousel/WhatsApp%20Image%202026-09-09%20at%2000.44.11%20%281%29.jpg", "w": 1067, "h": 1600, "caption": ""}], "story": true, "dabbler": false, "credits": ["Rishika Gundi"], "slug": "illuminate"}, "4": {"k": "Fate Matchbooks · 2025", "q": "What if fateful experiences could be intentionally cultivated?", "above": "Fateful experiences imbue the everyday a sense of magic. These moments happen in the most unexpected of circumstances: the cashier at the grocery store having the same birthday as you, or discovering that your long-lost childhood friend lives next door.", "below": "What if there was a way we could invite more of these moments to catch our attention? Fate Matchbooks was a project that invited participants to seek out the most magical, ordinary experiences of their day, and pass it on to the people around them.", "caption": "Fate Matchbooks Designed by K.Huang, Y. Al Riyami, A.R. Gunawan (2025)", "support": [{"src": "assets/fate%20matchbooks/IMG_4795%20copy.jpg", "w": 1600, "h": 900, "caption": ""}, {"src": "assets/fate%20matchbooks/IMG_4817%20copy.jpg", "w": 1600, "h": 900, "caption": ""}], "carousel": [], "story": true, "dabbler": false, "credits": ["Kel Huang", "Yousef Al-Riyami", "Anastasha Rachel Gunawan"], "slug": "fate matchbooks"}, "5": {"k": "Lagu Hantu · 2026", "q": "What if we built our technologies with the spiritual ambition of the musical instrument?", "above": "Lagu Hantu resists the irresponsibly transient cultures of today's technologies. It follows a counter-model (the musical instrument); living technologies, built for cultural immortality and enduring ritual. It is a participatory sonic archive in the form of a handmade instrument installation that remembers everyone who has ever played it. When someone interacts with it, a bespoke computational algorithm searches an ever-growing archive of every past performance, summoning fragments that once accompanied similar gestures and playing them back through nearby loudspeakers.", "below": "We imagine the archive as a ritual rather than a repository, playing music with each other for centuries, and seeing the instrument far outlast us.", "caption": "", "support": [{"src": "assets/lagu%20hantu/laguhantu1%20-%20Anastasha%20Gunawan.jpg", "w": 1600, "h": 559, "caption": ""}, {"src": "assets/lagu%20hantu/laguhantu2%20-%20Anastasha%20Gunawan.jpg", "w": 1600, "h": 1034, "caption": ""}, {"src": "assets/lagu%20hantu/park_exhibit%20-%20Anastasha%20Gunawan.jpg", "w": 1600, "h": 1066, "caption": ""}], "carousel": [], "story": true, "dabbler": false, "credits": ["Anastasha Rachel Gunawan"], "slug": "lagu hantu"}, "6": {"k": "are we there yet? · 2026", "q": "What if time was a felt sensation?", "above": "Time is a resource in the English language-- something to be spent, saved, wasted, or used wisely. But this way of thinking about time inevitably leads to a scarce and fleeting relationship, where every moment spent is one that you can never get back. How can we learn to relate to it differently?", "below": "are we there yet? (2026) is an interactive installation and performance art piece which offers a new approach to the practice of meditation. As participants cross off lines of repeating text on a wall, the sensation of time passing becomes impossible to ignore.", "caption": "Are We There Yet? · Installation and Performance Piece by Kel Huang (2026)", "support": [{"src": "assets/awty/awty2.jpg", "w": 1600, "h": 637, "caption": ""}], "carousel": [], "story": true, "dabbler": false, "credits": ["Kel Huang"], "slug": "awty"}, "7": {"k": "desa-kala-patra · 2026", "q": "What if our time & technologies were bound by the rhythms of nature?", "above": "Made with a moisture sensor, an arduino, copper, wood, and gold paint, Desa-Kala-Patra is a water-sensing gong—it imagines an automated instrument that facilitates rituals at the coming of rain. It is guided by the ancient Balinese philosophy of harmony between time, place, and circumstance, facilitating rituals that are bound by the rhythms of nature. The gong will ring with the coming of rain, drawing the community together to signal the beginning of a new cycle of growth, a new season of change.", "below": "", "caption": "", "support": [{"src": "assets/desa-kala-patra/timepiece%20-%20Anastasha%20Gunawan.jpg", "w": 1600, "h": 1067, "caption": ""}], "carousel": [], "story": true, "dabbler": false, "credits": ["Anastasha Rachel Gunawan"], "slug": "desa-kala-patra"}, "8": {"k": "Exploratorium — Light Play · 2025", "q": "What if making art reminds us to be kids again?", "above": "Anastasha partnered with the Exploratorium to bring Light Play to the Stanford d.school's 20th anniversary exhibition. With the tinkering studio's materials, we built an exhibition that allowed participants to \"mess up\" and rework each box, inviting analog play for an ever-changing display, and bringing about collective ownership & imagination.", "below": "", "caption": "", "support": [{"src": "assets/light%20play/play%20-%20Anastasha%20Gunawan.jpg", "w": 1362, "h": 1280, "caption": ""}], "carousel": [], "story": true, "dabbler": false, "credits": ["Anastasha Rachel Gunawan"], "slug": "light play"}, "9": {"k": "Understanding Understanding · 2026", "q": "What if the people you love could turn you into a poet?", "above": "Understanding Understanding is an instrument and process for turning shared perception into art. Two people walk together with a disposable camera, taking turns seeing and scribing so that a shared world starts to surface between them. Back home, they transform what they collected into a blackout poem. The process ends in a small private gallery, so the art and the relationship behind it get witnessed. The participants learn together in this process that understanding someone doesn't mean seeing the same thing, but weaving two ways of seeing into one.", "below": "", "caption": "", "support": [{"src": "assets/understanding%20understanding/WhatsApp%20Image%202026-09-09%20at%2015.46.31%20%2810%29.jpg", "w": 1600, "h": 1068, "caption": ""}, {"src": "assets/understanding%20understanding/WhatsApp%20Image%202026-09-09%20at%2015.46.31%20%282%29.jpg", "w": 1600, "h": 1068, "caption": ""}, {"src": "assets/understanding%20understanding/WhatsApp%20Image%202026-09-09%20at%2015.46.31%20%284%29.jpg", "w": 1600, "h": 1067, "caption": ""}], "carousel": [{"src": "assets/understanding%20understanding/carousel/WhatsApp%20Image%202026-09-09%20at%2015.46.31%20%281%29.jpg", "w": 1600, "h": 829, "caption": ""}, {"src": "assets/understanding%20understanding/carousel/WhatsApp%20Image%202026-09-09%20at%2015.46.31%20%283%29.jpg", "w": 1600, "h": 1067, "caption": ""}, {"src": "assets/understanding%20understanding/carousel/WhatsApp%20Image%202026-09-09%20at%2015.46.31%20%285%29.jpg", "w": 1600, "h": 1068, "caption": ""}, {"src": "assets/understanding%20understanding/carousel/WhatsApp%20Image%202026-09-09%20at%2015.46.31%20%286%29.jpg", "w": 1600, "h": 1067, "caption": ""}, {"src": "assets/understanding%20understanding/carousel/WhatsApp%20Image%202026-09-09%20at%2015.46.31%20%287%29.jpg", "w": 1600, "h": 900, "caption": ""}, {"src": "assets/understanding%20understanding/carousel/WhatsApp%20Image%202026-09-09%20at%2015.46.31%20%288%29.jpg", "w": 1068, "h": 1600, "caption": ""}, {"src": "assets/understanding%20understanding/carousel/WhatsApp%20Image%202026-09-09%20at%2015.46.31.jpg", "w": 1067, "h": 1600, "caption": ""}, {"src": "assets/understanding%20understanding/carousel/WhatsApp%20Image%202026-09-09%20at%2015.46.32.jpg", "w": 1600, "h": 900, "caption": ""}, {"src": "assets/understanding%20understanding/carousel/WhatsApp%20Image%202026-09-09%20at%2015.53.34%20%281%29.jpg", "w": 1600, "h": 1067, "caption": ""}, {"src": "assets/understanding%20understanding/carousel/WhatsApp%20Image%202026-09-09%20at%2015.53.34%20%282%29.jpg", "w": 1600, "h": 1067, "caption": ""}, {"src": "assets/understanding%20understanding/carousel/WhatsApp%20Image%202026-09-09%20at%2015.53.34.jpg", "w": 1600, "h": 1067, "caption": ""}], "story": true, "dabbler": false, "credits": ["Yousef Al-Riyami"], "slug": "understanding understanding"}, "10": {"k": "When Is Now? · 2024", "q": "What if we reimagined time for a mind that forgets?", "above": "When Is Now? is a conceptual clock inspired by the experience of Alzheimer's disease. Rather than measuring hours and minutes, it visualizes one's place within the changing seasons, offering time as orientation instead of precision.", "below": "The piece explores how design can preserve presence and dignity when conventional ways of understanding time begin to fade. Learn more: https://dianerhim.me/time-piece-when-is-now", "caption": "", "support": [{"src": "assets/when%20is%20now%3F/timepiece1%20-%20Diane%20Rhim.jpg", "w": 1436, "h": 1600, "caption": ""}, {"src": "assets/when%20is%20now%3F/timepiece3%20-%20Diane%20Rhim.jpg", "w": 1200, "h": 1600, "caption": ""}], "carousel": [], "story": true, "dabbler": false, "credits": ["Diane Rhim"], "slug": "when is now?"}, "11": {"k": "P.S. I Love You · 2026", "q": "What if love could be tasted?", "above": "Food is a conduit of love- it distills emotion and care in all its flavors and sets it onto a plate.", "below": "This piece is about love in all its flavors and learning to savor each one. It's about pausing to appreciate small moments of love that appear unannounced, gentle, warm, sometimes imperceptible, and letting the feeling wash over you.", "caption": "", "support": [{"src": "assets/PS%20I%20love%20you/WhatsApp%20Image%202026-09-10%20at%2023.55.30%20%281%29.jpg", "w": 1600, "h": 1067, "caption": ""}, {"src": "assets/PS%20I%20love%20you/WhatsApp%20Image%202026-09-10%20at%2023.55.30.jpg", "w": 1600, "h": 1067, "caption": ""}], "carousel": [{"src": "assets/PS%20I%20love%20you/carousel/WhatsApp%20Image%202026-09-10%20at%2023.55.31%20%281%29.jpg", "w": 1000, "h": 1000, "caption": ""}, {"src": "assets/PS%20I%20love%20you/carousel/WhatsApp%20Image%202026-09-10%20at%2023.55.31%20%282%29.jpg", "w": 1000, "h": 1000, "caption": ""}, {"src": "assets/PS%20I%20love%20you/carousel/WhatsApp%20Image%202026-09-10%20at%2023.55.31%20%283%29.jpg", "w": 1000, "h": 1000, "caption": ""}, {"src": "assets/PS%20I%20love%20you/carousel/WhatsApp%20Image%202026-09-10%20at%2023.55.31.jpg", "w": 1600, "h": 1067, "caption": ""}, {"src": "assets/PS%20I%20love%20you/carousel/WhatsApp%20Image%202026-09-10%20at%2023.55.32.jpg", "w": 1000, "h": 1000, "caption": ""}], "story": true, "dabbler": false, "credits": ["Rishika Gundi"], "slug": "PS I love you"}};

/* Every ramp is sampled to 57 stops with smoothstep easing between keys, so the rate
   of change never jumps at a stop and no two neighbours are separable. */
const ramp=(keys,n)=>{
  const px=c=>c[0]==='#'? [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16),1]
                        : c.match(/[\d.]+/g).map(Number);
  const out=[];
  for(let i=0;i<=n;i++){
    const t=i/n;
    let k=0; while(k<keys.length-2 && keys[k+1][0]<t) k++;
    const [t0,c0]=keys[k], [t1,c1]=keys[k+1];
    let u=(t-t0)/(t1-t0); u=Math.min(1,Math.max(0,u));
    const e=u*u*(3-2*u);
    const a=px(c0), b=px(c1);
    const v=[0,1,2].map(j=>Math.round(a[j]+(b[j]-a[j])*e));
    const a3=(a[3]===undefined?1:a[3]), b3=(b[3]===undefined?1:b[3]);
    const al=a3+(b3-a3)*e;
    out.push([t,`rgba(${v[0]},${v[1]},${v[2]},${al.toFixed(3)})`]);
  }
  return out;
};
/* A raised cosine falls to zero at both ends *and* flattens as it gets there, so the
   line dissolves rather than stopping. */
const taper=(centre,half,rgbMid,rgbEnd,peak,n,rgbCore,coreW)=>{
  const out=[];
  for(let i=0;i<=n;i++){
    const u=i/n;                       // -1..1 across the segment
    const x=-1+2*u;
    const a=peak*0.5*(1+Math.cos(Math.PI*x));
    const m=1-Math.abs(x);
    let c=[0,1,2].map(j=>Math.round(rgbEnd[j]+(rgbMid[j]-rgbEnd[j])*m));
    if(rgbCore){                       // a glint of the sun's own edge, dead centre
      const t=Math.max(0,1-Math.abs(x)/coreW), g=t*t*(3-2*t);
      c=c.map((v,j)=>Math.round(v+(rgbCore[j]-v)*g));
    }
    const pos=(centre+half*x)*100;
    out.push(`rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)}) ${pos.toFixed(2)}%`);
  }
  return `linear-gradient(90deg,rgba(255,120,0,0) 0%,${out.join(',')},rgba(255,120,0,0) 100%)`;
};

const taperMask=(centre,half,peak,n)=>{
  const out=[];
  for(let i=0;i<=n;i++){
    const x=-1+2*(i/n);
    const a=peak*0.5*(1+Math.cos(Math.PI*x));
    out.push(`rgba(0,0,0,${a.toFixed(3)}) ${((centre+half*x)*100).toFixed(2)}%`);
  }
  return `linear-gradient(90deg,rgba(0,0,0,0) 0%,${out.join(',')},rgba(0,0,0,0) 100%)`;
};

/* Picking one up holds it still while the rest of the bloom carries on. Its phase is
   re-anchored every frame, so on release it simply resumes from where it is — nothing
   snaps back across the screen. */
/* Hover is hit-tested by hand, every few frames.
   Two reasons the browser cannot be trusted with this here. It only re-tests what is
   under the cursor when the CURSOR moves, so a picture drifting onto a still pointer is
   never noticed. And elementFromPoint is unreliable inside a preserve-3d field: most of
   the pictures report as the container rather than themselves, which left a large and
   arbitrary dead zone. Measuring the boxes ourselves and taking the frontmost makes
   every picture reactive, everywhere. */

function hitAt(x,y){
  let best=null, bz=-1e9;
  for(const n of HERO.nodes){
    if(!n.story) continue;
    const r=n.el.getBoundingClientRect();
    if(x>=r.left && x<=r.right && y>=r.top && y<=r.bottom && n.sz>bz){ bz=n.sz; best=n }
  }
  return best;                                   // frontmost wins, as it does on screen
}

function pickUp(n){
  if(hotNode===n) return;
  clearHot();
  hotNode=n;
  n.aHold=n.a+HERO.rot+HERO.rotOffset;

  /* Work out, once, how far it needs to come inward so the whole picture and its
     caption end up on screen — then move there in one calm slide. Recomputing this
     every frame is what made the motion duck and weave. */
  const r=n.el.getBoundingClientRect();
  const gNow=PER/(PER-n.z), gEnd=PER/(PER-(n.z+LIFT));
  const grow=gEnd/gNow;
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const w=r.width*grow, h=r.height*grow, m=30;
  let dx=0, dy=0;
  if(w>innerWidth-2*m)            dx=innerWidth/2-cx;
  else if(cx-w/2<m)               dx=m-(cx-w/2);
  else if(cx+w/2>innerWidth-m)    dx=(innerWidth-m)-(cx+w/2);
  if(h>innerHeight-2*m)           dy=innerHeight/2-cy;
  else if(cy-h/2<m)               dy=m-(cy-h/2);
  else if(cy+h/2>innerHeight-m)   dy=(innerHeight-m)-(cy+h/2);
  n.pullTX=dx/gEnd; n.pullTY=dy/gEnd;            // screen pixels -> world pixels
  n.el.classList.add('hot');
}
function clearHot(){
  if(hotNode){ hotNode.el.classList.remove('hot'); hotNode.aHold=undefined; hotNode.box=null;
                hotNode.pullTX=0; hotNode.pullTY=0; hotNode=null }
}

function buildCaro(list){

function caroGo(n){

  if(caro.num) caro.num.textContent=(caro.i+1)+' / '+caro.items.length;
  if(caro.prev) caro.prev.disabled = caro.i===0;
  if(caro.next) caro.next.disabled = caro.i===max;

    const cMax=(innerWidth-r.left)+(innerHeight-r.top);   // far corner of the mark
    const pad=Math.max(58, innerHeight*0.045);
    return clamp(Math.max(MAXD()*0.32, cMax+pad), 0, MAXD()*0.9);
  }
  /* Wide/landscape: rest short of the mark, the fold never reaching it. */
  const clear=r.right+r.bottom+Math.max(90,innerWidth*0.06);
  return Math.max(MAXD()*0.32, MAXD()-clear);
};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let d=0, want=0, dragging=false, moved=false, open=false, sx=0, sy=0;

/* Leaving for a sub-page: carry the peel past the far corner so the paper covers the whole
   window - cream ground, black mark - and only then follow the link. The sub-page opens on
   the same cream ground with the same black mark, so the two documents meet on an identical
   frame and the change of file does not show. */
let leaving=null, leaveAt=0, went=false;
function leaveTo(url){
  if(leaving) return;
  leaving=url; leaveAt=performance.now(); open=true; want=MAXD();
}

const onPaper=(x,y)=>((innerWidth-x)+(innerHeight-y)) < d;
const nearCorner=(x,y)=>((innerWidth-x)+(innerHeight-y))<340;   // a generous corner target (mouse)
function onDog(x,y){ const r=dog.getBoundingClientRect(), pad=12;
  return x>=r.left-pad && x<=r.right+pad && y>=r.top-pad && y<=r.bottom+pad; }  // just the info mark (touch)

addEventListener('pointerdown',e=>{
  if(cardOpen || leaving) return;
  lastPT=e.pointerType;
  /* the dog-ear always belongs to the peel, even if a picture was still in hand */
  if(cornerCore(e.clientX,e.clientY)) clearHot();
  if(hotNode) return;                          // otherwise a picture has this press
  clearHot();
  sx=e.clientX; sy=e.clientY; moved=false;
  if(open){ dragging=true; document.body.style.cursor='grabbing' }   // drag only ever adjusts an already-open menu
});
addEventListener('pointermove',e=>{
  if(Math.hypot(e.clientX-sx,e.clientY-sy)>10) moved=true;
  if(!dragging) return;
  if(moved) want=clamp((innerWidth-e.clientX)+(innerHeight-e.clientY),0,MAXD());
});
addEventListener('pointerup',e=>{
  if(leaving) return;
  if(e.pointerType==='touch'){
    const wasDrag = dragging && moved;                 // a deliberate corner peel
    dragging=false; document.body.style.cursor='';
    if(cardOpen) return;
    if(wasDrag){ open = want > OPEN()*0.42; want = open? OPEN() : 0; return; }
    if(moved) return;                                  // a scroll/slide, not a tap
    if(open){ if(!onPaper(e.clientX,e.clientY)){ open=false; want=0 } return; }
    if(onDog(e.clientX,e.clientY)){ open=true; want=OPEN(); return; }  // only the mark opens the menu
    const hit = hitAt(e.clientX,e.clientY);
    if(hit) openStory(hit);                            // a tap on a picture opens its card
    return;
  }
  const wasDrag = dragging;
  dragging=false; document.body.style.cursor='';
  if(wasDrag && moved){ open = want > OPEN()*0.42; want = open? OPEN() : 0; return; }  // dragging an already-open menu
  if(moved) return;                                                                    // a slide, not a click
  if(open){ if(!onPaper(e.clientX,e.clientY)){ open=false; want=0 } return; }           // click off the open paper → home
  if(onDog(e.clientX,e.clientY)){ open=true; want=OPEN() }                              // only the info mark opens
});
addEventListener('keydown',e=>{
  if(cardOpen && caro && e.key==='ArrowLeft'){ caroGo(caro.i-1); return; }
  if(cardOpen && caro && e.key==='ArrowRight'){ caroGo(caro.i+1); return; }
  if(e.key!=='Escape') return;
  if(cardOpen) closeStory(); else { open=false; want=0 } });

let SPAN=0, SKYH=0, SUNR=0, WASHR=0, LIMBL=0, GLOWL=0;
const SQ2=Math.SQRT2;

/* Everything about the sky is baked once, at load and on resize. Nothing here is
   recomputed while you drag — the fold, the sun and the limb are all moved by
   transform alone, so not one pixel is ever repainted mid-gesture. */
function buildSky(){
  const W=innerWidth, H=innerHeight, diag=Math.hypot(W,H);
  SPAN=Math.ceil((W+H)*1.06);                 // long enough to reach every corner along the fold
  SUNR=Math.min(W,H)*1.30;
  WASHR=SUNR*1.20;
  const SKYSCALE=(W+H)*0.42;                  // how far the night reaches from the fold
  SKYH=Math.ceil(SKYSCALE*1.7);
  LIMBL=Math.round(SUNR*0.33);                // the lit segment of horizon
  GLOWL=Math.round(LIMBL*2.1);

  paper.style.width=SPAN+'px'; paper.style.height=SPAN+'px';
  fold.style.width=SPAN+'px';
  dawn.style.width=SPAN+'px'; dawn.style.height=SKYH+'px';
  limb.style.width=LIMBL+'px'; limbGlow.style.width=GLOWL+'px';
  const GB=Math.ceil(WASHR*2);
  glow.style.width=GB+'px'; glow.style.height=GB+'px';

  /* the sky: pale at the fold, night far from it — measured in pixels, so it holds
     its shape wherever the fold happens to be */
  const skyPx=SKY.map(([t,c])=>`${c} ${((1-t)*SKYSCALE).toFixed(0)}px`).reverse().join(',');
  /* and a shadow running along the fold, so one end of the horizon stays dark */
  const a=(-0.48*diag).toFixed(0), b=(0.09*diag).toFixed(0), c2=(0.65*diag).toFixed(0);
  dawn.style.background=
    `linear-gradient(90deg,rgba(1,3,11,0) calc(50% + ${a}px),`+
      `rgba(1,4,14,.34) calc(50% + ${b}px),rgba(1,3,10,.74) calc(50% + ${c2}px)),`+
    `linear-gradient(0deg,${skyPx})`;

  /* the sun, drawn once into its own box and simply moved around */
  glow.style.background=
    `radial-gradient(circle ${SUNR.toFixed(0)}px at 50% 50%,${stops(SUN,1,0)}),`+
    `radial-gradient(circle ${WASHR.toFixed(0)}px at 50% 50%,${stops(WASH,1,0)})`;

  /* the limb is its own short segment now, so its taper never has to be recomputed */
  limb.style.background=taper(0.5,0.5,[255,198,72],[255,112,0],1.00,46);
  const m=taperMask(0.5,0.5,0.9,40);
  limbGlow.style.webkitMaskImage=m; limbGlow.style.maskImage=m;
}

let logoBox=null;
const measureLogo=()=>{ logoBox=logo.getBoundingClientRect() };
addEventListener('resize',()=>{ measureLogo(); buildSky() });
setTimeout(()=>{ measureLogo(); buildSky() },0);

let warm=false, grainOn=false, lastSun=-1, foldOn=false, worldOn=true;
let sunCx=0, sunCy=0;

HERO.frame.push(()=>{
  /* While you are holding it, the edge tracks the cursor 1:1 — any easing here reads
     as input lag. The easing is only for the release, when it settles on its own. */
  if(dragging) d=want; else { d+=(want-d)*HERO.ease(0.1); if(Math.abs(want-d)<0.4) d=want }
  /* `leaving` is never cleared, and the frame is not cut short. The browser keeps painting
     this document until the new one commits, so clearing it would let lv fall back to 0 and
     flash the links bright again on the very last frames before the change. */
  if(leaving && !went){
    const t=performance.now();
    if(d>MAXD()*0.985 || t-leaveAt>1600){ went=true; location.href=leaving }
  }
  const dp=-d/SQ2, off=-SPAN/2;
  paper.style.transform=`rotate(-45deg) translate(${off}px,${dp.toFixed(1)}px)`;
  const T=innerWidth+innerHeight;
  const p=d/T;                       // fraction of the diagonal
  const q=clamp(d/OPEN(),0,1.6);     // fraction of the way to the resting point

  /* The splash cross-fades entirely BEHIND the sky, where nobody can see it happen.

     The sky itself fades out over q 0.92 -> 0.42 (see `sun` below), so the bloom has to be
     fully painted BEFORE the sky starts thinning - otherwise the night gradient sits over a
     half-drawn bloom and dims it, which looks like the page loading. Measured: paper + sky
     occlude the bloom completely for q >= 0.70. So the fade runs 0.95 -> 0.75, finished
     while the sky is still near-solid, and the sky then lifts away over a bloom that has
     been there the whole time. Closing is a pure reveal.

     The original curve (1-q*2.2) faded it over q 0.45 -> 0 instead - long after the sun had
     gone at q=0.42. For about half a second neither the sunrise nor the pictures were on
     screen: it went black and the home page appeared to reload. That was the "refresh".

     Keep the whole window above q=0.70. Below ~0.48 the sky no longer covers and pictures
     ghost through the night side. */
  const fadeOut=clamp((0.95-q)/0.20,0,1);
  const rin=clamp((performance.now()-1000)/1800,0,1);
  world.style.opacity=fadeOut;
  ringEl.style.opacity=fadeOut*rin*0.85;
  const showWorld=fadeOut>0.001;     // 30 transformed images cost nothing once hidden
  if(showWorld!==worldOn){ worldOn=showWorld; world.style.visibility=worldOn?'':'hidden' }
  HERO.freeze=!worldOn;              // hold the spiral exactly where it left off
  /* freeze the instant a picture is hovered, or it drifts out from under the cursor
     before you can read it; ease back only on the way out */
  /* only the picked-up picture stops; the rest of the swirl carries on */
  hoverSlow = cardOpen? 1 : hoverSlow*0.90;
  /* The peel does not slow the swirl at all - it drifts at one speed throughout, and is
     already in motion the moment the page uncovers it. Only an open story card stills it.
     HERO.freeze below still holds the field while it is hidden, so it comes back exactly
     where it was left; that stop is never seen, and there is no ramp on either side. */
  HERO.slow=hoverSlow;
  titleWrap.style.opacity=fadeOut;      // same curve, for the same reason
  hintEl.style.display = q>0.03? 'none' : '';

  /* ---- sunrise: position only, never paint ---- */
  const sun=clamp((q-0.42)/0.5,0,1);
  const sq=Math.round(sun*100)/100;
  if(sq!==lastSun){
    lastSun=sq;
    dawn.style.opacity=sq; glow.style.opacity=sq;
    limb.style.opacity=sq; limbGlow.style.opacity=sq;
  }
  if((sun>0)!==warm){ warm=sun>0;
    fold.style.background = warm
      ? 'linear-gradient(90deg,rgba(255,228,190,0) 34%,rgba(255,228,190,.30) 50%,rgba(255,214,160,0) 68%)'
      : 'linear-gradient(90deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.7) 50%,rgba(255,255,255,0) 72%)';
  }
  if(sq>0){
    dawn.style.transform=`rotate(-45deg) translate(${off}px,${(dp-SKYH).toFixed(1)}px)`;
    /* where the sun meets the fold */
    const S=T-d;
    const x1=Math.min(S,innerWidth),  y1=S-x1;
    const y2=Math.min(S,innerHeight), x2=S-y2;
    const hx=x2+(x1-x2)*0.29, hy=y2+(y1-y2)*0.29;
    const k=SUNR*0.28;                          // buried under the horizon
    sunCx=hx+k; sunCy=hy+k;
    glow.style.transform=`translate(${sunCx.toFixed(1)}px,${sunCy.toFixed(1)}px) translate(-50%,-50%)`;
    limb.style.transform=`translate(${hx.toFixed(1)}px,${hy.toFixed(1)}px) rotate(-45deg) translate(-50%,-2px)`;
    limbGlow.style.transform=`translate(${hx.toFixed(1)}px,${hy.toFixed(1)}px) rotate(-45deg) translate(-50%,-25px)`;
  }

  if((d>6)!==foldOn){ foldOn=d>6; fold.style.opacity=foldOn?1:0 }
  dog.style.opacity = clamp(1-q*8,0,1);
  back.classList.toggle('on', open && q>0.8);

  /* menu items ease in one after another, continuously */
  /* On the way out the links fade with the last of the fold, so the final frame before
     the link is followed is bare cream and a black mark - which is exactly the frame the
     next page opens on. Leave them lit and they pop away at the seam. */
  const lv = leaving ? clamp((d-OPEN())/Math.max(1,MAXD()-OPEN()),0,1) : 0;
  items.forEach((li,i)=>{
    const o=clamp((q-(0.18+i*0.09))/0.28,0,1)*(1-lv);
    li.style.opacity=o;
    li.style.transform=`translateX(${(1-o)*30}px)`;
  });
  credit.style.opacity=clamp((q-0.72)/0.24,0,1);
  under.classList.toggle('live', q>0.5);

  /* the mark flips white→black if the paper reaches it, or if the sky behind it
     gets bright enough that white would stop reading */
  const r=logoBox||logo.getBoundingClientRect();
  const lx=r.left+r.width*0.5, ly=r.top+r.height*0.5;
  const c=(innerWidth-lx)+(innerHeight-ly);
  const onPaperNow=clamp((d-(c-110))/200,0,1);
  const lit=sun>0? clamp((1-Math.hypot(lx-sunCx,ly-sunCy)/SUNR-0.60)/0.10,0,1)*sun : 0;
  const over=Math.max(onPaperNow,lit);
  logoW.style.opacity=1-over; logoB.style.opacity=over;

  /* Release as soon as the pointer is off the picture, and grab whatever is under it.

     Hover stays off until the page is flat again - hence the d>0 test. `open` goes false
     the instant you click to go home, but the paper takes about a second to lay back down
     and the pictures are hidden behind it for most of that. hitAt() measures bounding
     boxes and does not care that they are invisible, so without this the swirl silently
     picks up pictures you cannot see, pulls them inward and rewrites their spiral angle -
     and they are somewhere new by the time the page fades back in. That was the "jarring
     reset on returning home". */
  if(cardOpen || dragging || open || d>0){ if(hotNode) clearHot() }
  else if((++tick%3===0)){
    const hit = (mx<0 || lastPT==='touch' || cornerCore(mx,my))? null : hitAt(mx,my);
    if(hit && hit!==hotNode) pickUp(hit);
    else if(!hit && hotNode){
      /* a picked-up picture drifts inward and can slide off the pointer; keep it in
         hand until the pointer is clearly away from it */
      const b=hotNode.box, sl=20;
      if(!b || mx<b.left-sl || mx>b.right+sl || my<b.top-sl || my>b.bottom+sl) clearHot();
    }
  }

  HERO.nodes.forEach(n=>{
    const on=(n===hotNode);
    /* one slow, even ease for both directions — calm rather than snappy */
    /* Ease only while the bloom is on screen. The world hides and returns at the same
       peel position, but an eased value lags in whichever direction it is travelling -
       so it arrived at the hide frame short of its target and at the show frame still
       short coming back, leaving lift ~180px apart at the same q. lift drives the
       perspective compensation below, so every picture came back displaced. Off screen
       there is nothing to smooth, so snap. */
    const liftTo=(-q*320)+(on?LIFT:0);
    n.lift = worldOn ? n.lift+(liftTo-n.lift)*HERO.ease(0.085) : liftTo;
    if(on){
      n.a=n.aHold-(HERO.rot+HERO.rotOffset);     // hold it still in the moving field
      n.box=n.el.getBoundingClientRect();        // for the release test only
    }
    /* Coming forward magnifies about the centre of the screen, which by itself would
       slide the picture outward as it grows. Cancelling that is what turns the motion
       into a straight lift instead of a drift-and-correct. */
    const k=n.lift/(PER-n.z);
    const compX=-(n.nx||0)*k, compY=-(n.ny||0)*k;
    const tx=on?(n.pullTX||0):0, ty=on?(n.pullTY||0):0;
    const eP=HERO.ease(0.085);
    n.px = worldOn ? (n.px||0)+(tx-(n.px||0))*eP : tx;   // same reasoning as lift
    n.py = worldOn ? (n.py||0)+(ty-(n.py||0))*eP : ty;
    if(!on && Math.abs(n.px)<0.3 && Math.abs(n.py)<0.3){ n.px=0; n.py=0 }
    n.ox=n.px+compX; n.oy=n.py+compY;
  });

});

</script>
</body>
</html>
